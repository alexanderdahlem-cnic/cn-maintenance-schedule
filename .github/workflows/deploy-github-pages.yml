# Builds with the correct Vite base path and publishes dist/ to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Align JS-based Actions with Node 24 before Node 20 removal from runners (see GitHub changelog).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      # Relative base so assets work on project Pages URLs and on *.pages.github.io previews.
      - name: Set Vite base for GitHub Pages
        run: echo "VITE_BASE=./" >> "$GITHUB_ENV"

      # Canonical GitHub Pages URL for logos when using maintenance-embed.js on another domain.
      - name: Set public asset URL for embed bundle
        run: |
          NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [[ "$NAME" == *.github.io ]]; then
            echo "VITE_ASSET_BASE_URL=https://${OWNER}.github.io" >> "$GITHUB_ENV"
          else
            echo "VITE_ASSET_BASE_URL=https://${OWNER}.github.io/${NAME}" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run build && npm run build:embed

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - uses: actions/deploy-pages@v5
        id: deployment

      - name: Pages deployment URL
        run: |
          echo "Open this URL for the current deploy (use it for embed src until canonical github.io is available):"
          echo "${{ steps.deployment.outputs.page_url }}"
